# docker-compose.dev.yml
version: "3.9"
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app              # monta código local
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: >
      uvicorn api_main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
